name: Feature request
description: Suggest a capability or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are read, but not all can be scheduled. The more
        concrete the use case, the more likely it is to land.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Device onboarding (ONVIF / RTSP / GB28181 / RTMP)
        - Live view and web playback
        - Recording and playback
        - PTZ and alarms
        - Stream distribution
        - Web console / UI
        - Deployment and operations
        - API / integration
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: Describe the situation, not the solution — what you cannot do today
      placeholder: We have 40 GB28181 cameras behind a carrier NAT and need ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working, including UI or API shape if relevant

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Other software, workarounds, scripts

  - type: input
    id: scale
    attributes:
      label: Scale of your deployment
      placeholder: 40 cameras, 30 days retention, Ubuntu 22.04
